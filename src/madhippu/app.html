<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>madhippu</title>
<style>
:root {
  --bg: #ffffff; --text: #000000; --muted: #666666; --line: #000000; --faint: #dddddd;
  --link: #0000ee; --warn: #8a5a00; --error: #c00000;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --text: #e8e8e8; --muted: #8a8a8a; --line: #e8e8e8; --faint: #2a2a2a;
    --link: #8ab4ff; --warn: #e0b050; --error: #ff6b6b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line);
  padding-bottom: 8px; margin-bottom: 8px; }
h1 { font-size: 14px; font-weight: 700; margin: 0; }
h2, h3 { font-size: 14px; font-weight: 700; margin: 0; }
.lead { color: var(--muted); margin: 0 0 24px; }
.quit { margin-left: auto; }
a { color: var(--link); }
button, .button { font: inherit; color: var(--text); background: none; border: 1px solid var(--line);
  border-radius: 0; padding: 2px 10px; cursor: pointer; text-decoration: none; display: inline-block; }
button:hover, .button:hover, button:focus-visible, .button:focus-visible { background: var(--text); color: var(--bg); outline: none; }
#drop { display: block; border: 1px dashed var(--line); padding: 48px 16px; text-align: center; cursor: pointer; }
#drop.over, #drop:focus-visible { border-style: solid; outline: none; background: var(--faint); }
#drop p { margin: 0; }
.note { color: var(--muted); }
.busy { padding: 48px 0; }
.busy .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.error { color: var(--error); border: 1px solid var(--error); padding: 8px 12px; margin: 16px 0; }
.error::before { content: "error: "; font-weight: 700; }
.summary { margin-bottom: 24px; }
.summary h2 { overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.warnings { color: var(--warn); margin: 8px 0; }
.warnings > div::before, .warnings li::before { content: "! "; }
.warnings ul { list-style: none; margin: 0; padding: 0; }
nav.toc { margin: 0 0 24px; }
nav.toc a { display: block; }
nav.toc a::before { content: "→ "; color: var(--muted); }
section.st { margin-bottom: 32px; scroll-margin-top: 16px; }
section.st > .head { display: flex; gap: 4px 16px; align-items: baseline; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); padding-bottom: 4px; }
section.st .warnings { margin: 8px 0; }
.meta { color: var(--muted); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 3px 12px 3px 0; border-bottom: 1px solid var(--faint); }
td:first-child { min-width: 22em; }
@media (max-width: 600px) { td:first-child { min-width: 14em; } }
th { text-align: right; font-weight: 700; white-space: nowrap; border-bottom-color: var(--line); }
th:first-child, td:first-child { text-align: left; }
th:last-child, td:last-child { padding-right: 0; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.dropped { color: var(--muted); cursor: help; }
tbody tr:hover { background: var(--faint); }
footer { margin-top: 48px; border-top: 1px solid var(--line); padding-top: 8px; color: var(--muted); }
footer p { margin: 4px 0; }
.hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>madhippu</h1>
    <button class="quit" id="quit" title="Stop madhippu">quit</button>
  </header>
  <p class="lead">Reads the balance sheet, profit and loss and cash flows out of an Indian annual report.</p>

  <div id="start">
    <label id="drop" tabindex="0">
      <p>[ drop an annual report PDF here, or click to choose ]</p>
      <p class="note">the file stays on this computer. nothing is uploaded.</p>
      <input id="file" type="file" accept="application/pdf,.pdf" hidden>
    </label>
  </div>

  <div id="busy" class="busy hidden">
    <div>reading <span id="busy-name"></span><span class="dots"></span></div>
    <div class="note">a long report can take a minute.</div>
  </div>

  <div id="error" class="error hidden"></div>
  <div id="result" class="hidden"></div>

  <footer>
    <p>{{DISCLAIMER}}</p>
    <p>madhippu {{VERSION}} · free software under the AGPL-3.0 ·
      <a href="https://github.com/MuthuSubramanian00/madhippu" target="_blank" rel="noopener">source and help</a></p>
  </footer>
</main>

<script>
const TOKEN = "{{TOKEN}}";
const TITLES = { balance_sheet: "Balance sheet", profit_and_loss: "Profit and loss", cash_flow: "Cash flows" };
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);  // strings become text, never HTML
  return node;
};

function show(which) {
  for (const id of ["start", "busy", "result"]) $(id).classList.toggle("hidden", id !== which);
}
function fail(message) {
  $("error").textContent = message;
  $("error").classList.remove("hidden");
  show("start");
}

const amount = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 });
function format(value, row) {
  if (row.count) return amount.format(value);
  const text = amount.format(Math.abs(value));
  return value < 0 ? `(${text})` : text;  // negatives in brackets, as reports print them
}

async function upload(file) {
  if (!file) return;
  $("error").classList.add("hidden");
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") return fail("Please choose a PDF file.");
  $("busy-name").textContent = file.name;
  show("busy");
  try {
    const res = await fetch("/parse", {
      method: "POST",
      headers: { "X-Madhippu-Token": TOKEN, "X-Filename": unescape(encodeURIComponent(file.name)),
                 "Content-Type": "application/pdf" },
      body: file,
    });
    const data = await res.json();
    if (!res.ok) return fail(data.error || "Something went wrong.");
    render(data);
  } catch (e) {
    fail("Couldn't reach madhippu. Is its window still open?");
  }
}

function render(data) {
  const out = $("result");
  out.replaceChildren();
  const base = `/report/${data.id}`;
  const n = data.statements.length;

  const summary = el("div", { class: "summary" },
    el("h2", {}, data.file),
    el("div", { class: "meta" }, `${data.pages} pages · ${n} statement${n === 1 ? "" : "s"} found`));
  if (data.warnings.length) {
    summary.append(el("div", { class: "warnings" }, ...data.warnings.map((w) => el("div", {}, w))));
  }
  const actions = el("div", { class: "actions" });
  if (n) {
    actions.append(el("a", { class: "button primary", href: `${base}.xlsx` }, "download .xlsx"),
                   el("a", { class: "button", href: `${base}.json` }, "download .json"));
  }
  const again = el("button", {}, "read another");
  again.onclick = () => { $("file").value = ""; show("start"); };
  actions.append(again);
  summary.append(actions);
  out.append(summary);

  if (n) {
    out.append(el("nav", { class: "toc" }, ...data.statements.map((st, i) =>
      el("a", { href: `#st${i}` }, `${st.basis === "consolidated" ? "Consolidated" : "Standalone"} ${TITLES[st.kind].toLowerCase()}`))));
  }

  data.statements.forEach((st, i) => {
    const title = `${st.basis === "consolidated" ? "Consolidated" : "Standalone"} ${TITLES[st.kind].toLowerCase()}`;
    const head = el("div", { class: "head" },
      el("h3", {}, title),
      el("span", { class: "meta" },
        el("a", { href: `${base}.pdf#page=${st.page}`, target: "_blank", rel: "noopener",
                  title: "Open the report at this page to check the figures" }, `page ${st.page}`),
        ` · amounts in ${st.unit}`));
    const section = el("section", { class: "st", id: `st${i}` }, head);
    if (st.warnings.length) {
      section.append(el("div", { class: "warnings" },
        "Check these against the report:", el("ul", {}, ...st.warnings.map((w) => el("li", {}, w)))));
    }
    const thead = el("thead", {}, el("tr", {}, el("th", {}, st.period === "as at" ? "As at" : "Year ended"), ...st.columns.map((c) => el("th", {}, c))));
    const tbody = el("tbody");
    for (const row of st.rows) {
      const name = row.label + (row.per_share ? " (₹ per share)" : row.count ? " (number of shares)" : "");
      const tr = el("tr", {}, el("td", { title: row.item }, name));
      for (const v of row.values) {
        tr.append(v === null
          ? el("td", { class: "num dropped", title: "Left out: this section didn't add up to its printed total for this year" }, "—")
          : el("td", { class: "num" }, format(v, row)));
      }
      tbody.append(tr);
    }
    section.append(el("div", { class: "scroll" }, el("table", {}, thead, tbody)));
    out.append(section);
  });
  show("result");
  window.scrollTo(0, 0);
}

const drop = $("drop");
$("file").addEventListener("change", (e) => upload(e.target.files[0]));
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") $("file").click(); });
for (const t of ["dragenter", "dragover"]) drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); });
for (const t of ["dragleave", "drop"]) drop.addEventListener(t, () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); upload(e.dataTransfer.files[0]); });
// A file dropped outside the box shouldn't make the browser open it instead.
for (const t of ["dragover", "drop"]) window.addEventListener(t, (e) => e.preventDefault());

$("quit").onclick = async () => {
  try { await fetch("/quit", { method: "POST", headers: { "X-Madhippu-Token": TOKEN } }); } catch (e) {}
  document.body.replaceChildren(el("main", {}, el("h1", {}, "madhippu has stopped"),
    el("p", { class: "lead" }, "You can close this tab. Open madhippu again to read another report.")));
};
</script>
</body>
</html>
