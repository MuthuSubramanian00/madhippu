[project]
name = "madhippu"
version = "0.1.1"
description = "Financial statements out of Indian annual reports (PDF) into checked JSON or Excel. Deterministic, offline, no AI."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Muthu Subramanian" }]
keywords = ["annual report", "financial statements", "india", "pdf", "ind-as", "xbrl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pypdfium2>=4.30",
    "openpyxl>=3.1",
]

[project.urls]
Source = "https://github.com/MuthuSubramanian00/madhippu"

[project.scripts]
madhippu = "madhippu.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
madhippu = ["app.html"]
